<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Redirigiendo a Viento Norte…</title>
    <meta name="description" content="La ruta /mi-portafolio/ ya no es canónica. Redirige a https://vientonorte.io/" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="canonical" href="https://vientonorte.io/" />
    <meta property="og:url" content="https://vientonorte.io/" />
    <meta property="og:title" content="Viento Norte · UXtech" />
    <meta property="og:description" content="Módulos a medida, dueño del dato. Front office y craft enterprise." />
    <meta property="og:image" content="https://vientonorte.io/images/branding/og-portfolio.png" />
    <meta http-equiv="refresh" content="0;url=https://vientonorte.io/" />
    <script>
      (function () {
        // preserve hash route: /mi-portafolio/#/consultoria → /#/consultoria
        var h = window.location.hash || "#/";
        if (h.charAt(0) !== "#") h = "#" + h;
        // strip accidental double path if user landed with broken SW
        if (h.indexOf("#/mi-portafolio") === 0) h = "#" + h.slice("#/mi-portafolio".length) || "#/";
        window.location.replace("https://vientonorte.io/" + h);
      })();
    </script>
  </head>
  <body style="font-family:system-ui;background:#050a14;color:#e2e8f0;padding:2rem;text-align:center">
    <p>Canon: <a href="https://vientonorte.io/" style="color:#7dd3fc">https://vientonorte.io/</a></p>
    <p style="opacity:.7;font-size:.9rem">sin <code>/mi-portafolio/</code> — si ves esto más de 1s, hard refresh (borrar SW).</p>
  </body>
</html>
