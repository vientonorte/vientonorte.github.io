name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare _site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git/' --exclude '.github/' --exclude '_site/' --exclude 'node_modules/' ./ _site/
          touch _site/.nojekyll
          python3 - <<'PY'
import json
m=json.load(open("_site/ops/finanzas/ledger.json"))["meta"]
policy = m.get("split_policy")
tasks = m.get("summary_mtd_tasks") or 0
print(policy, tasks, m.get("summary_mtd_usd"))
# SSOT actual: 40 Micro1 / 5 VN / 3 post (antes 80/10/10)
assert policy == "40m1_5vn_3post", f"split_policy inesperado: {policy}"
assert tasks >= 12, f"summary_mtd_tasks < 12: {tasks}"
PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
