name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare _site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git/' --exclude '.github/' --exclude '_site/' --exclude 'node_modules/' ./ _site/
          touch _site/.nojekyll
          python3 - <<'PY'
import json
m=json.load(open("_site/ops/finanzas/ledger.json"))["meta"]
print(m.get("split_policy"), m.get("summary_mtd_tasks"), m.get("summary_mtd_usd"))
assert m.get("split_policy")=="80_micro1_10_vn_10_post"
assert (m.get("summary_mtd_tasks") or 0) >= 12
PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
